# =============================================================================
# AEGIS Platform — Nginx Reverse Proxy Configuration
# =============================================================================
# Routes incoming requests to the correct internal micro-service container.
# WebSocket support is enabled for Plotly Dash live callbacks.
# SSL/TLS will be layered on top via certbot at a later stage.
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

# ---------- upstream map (one block per service) ----------
upstream aegis-command          { server aegis-command:9000; }
upstream aegis-watchtower       { server aegis-watchtower:9001; }
upstream aegis-bastion          { server aegis-bastion:9011; }
upstream aegis-spectre          { server aegis-spectre:9012; }
upstream aegis-viper            { server aegis-viper:9013; }
upstream aegis-trident          { server aegis-trident:9014; }
upstream aegis-rampart          { server aegis-rampart:9015; }
upstream aegis-echelon          { server aegis-echelon:9016; }
upstream aegis-bulwark          { server aegis-bulwark:9017; }
upstream aegis-corsair          { server aegis-corsair:9018; }
upstream aegis-nexus            { server aegis-nexus:9019; }
upstream aegis-ledger           { server aegis-ledger:9020; }

# ---------- shared proxy parameters (included per-location) ----------
# Kept in a named map so every location block stays DRY.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────
server {
    listen 80;
    server_name aegis.expediteconsults.com;
    return 301 https://$server_name$request_uri;
}

# ── HTTPS server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name aegis.expediteconsults.com;

    # ── SSL certificates ─────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Global client / buffer settings ──────────────────────────────────
    client_max_body_size        100M;       # allow large report uploads
    proxy_buffering             on;
    proxy_buffer_size           128k;
    proxy_buffers               8 256k;
    proxy_busy_buffers_size     256k;

    # ── gzip compression ─────────────────────────────────────────────────
    gzip                on;
    gzip_vary           on;
    gzip_proxied        any;
    gzip_comp_level     6;
    gzip_min_length     1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Shared proxy headers (inherited by all locations) ────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket upgrade headers
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_http_version 1.1;
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;

    # ── / — COMMAND launchpad ────────────────────────────────────────────
    location / {
        proxy_pass http://aegis-command;
    }

    # ── /watchtower ──────────────────────────────────────────────────────
    location /watchtower/ {
        proxy_pass http://aegis-watchtower/;
    }
    location /watchtower {
        return 301 /watchtower/;
    }

    # ── /bastion — Security Operations Centre ────────────────────────────
    location /bastion/ {
        proxy_pass http://aegis-bastion/;
    }
    location /bastion {
        return 301 /bastion/;
    }

    # ── /spectre — External Attack Surface ───────────────────────────────
    location /spectre/ {
        proxy_pass http://aegis-spectre/;
    }
    location /spectre {
        return 301 /spectre/;
    }

    # ── /viper — Red Team Operations ─────────────────────────────────────
    location /viper/ {
        proxy_pass http://aegis-viper/;
    }
    location /viper {
        return 301 /viper/;
    }

    # ── /trident — Red Team Suite ────────────────────────────────────────
    location /trident/ {
        proxy_pass http://aegis-trident/;
    }
    location /trident {
        return 301 /trident/;
    }

    # ── /rampart — Defensive Security ────────────────────────────────────
    location /rampart/ {
        proxy_pass http://aegis-rampart/;
    }
    location /rampart {
        return 301 /rampart/;
    }

    # ── /echelon — Specialised Tools ─────────────────────────────────────
    location /echelon/ {
        proxy_pass http://aegis-echelon/;
    }
    location /echelon {
        return 301 /echelon/;
    }

    # ── /bulwark — Governance, Risk & Compliance ─────────────────────────
    location /bulwark/ {
        proxy_pass http://aegis-bulwark/;
    }
    location /bulwark {
        return 301 /bulwark/;
    }

    # ── /corsair — Digital Forensics & Incident Response ─────────────────
    location /corsair/ {
        proxy_pass http://aegis-corsair/;
    }
    location /corsair {
        return 301 /corsair/;
    }

    # ── /nexus — Platform Management ─────────────────────────────────────
    location /nexus/ {
        proxy_pass http://aegis-nexus/;
    }
    location /nexus {
        return 301 /nexus/;
    }

    # ── /ledger — Report Generation & Downloads ──────────────────────────
    location /ledger/ {
        proxy_pass http://aegis-ledger/;
    }
    location /ledger {
        return 301 /ledger/;
    }
    location /ledger-assets/ {
        proxy_pass http://aegis-ledger/;

        # Extra-large buffers for PDF downloads
        proxy_buffer_size       256k;
        proxy_buffers           16 512k;
        proxy_busy_buffers_size 512k;
    }

    # ── Health-check endpoint (used by deploy.sh & Docker HEALTHCHECK) ───
    location /nginx-health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}

} # end http
